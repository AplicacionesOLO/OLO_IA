<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OLO IA">
  <!-- Cerebro cibernético: dos hemisferios con pistas de circuito y nodos. Fondo oscuro
       propio para que se lea igual en pestañas claras y oscuras, y trazos gruesos para
       que sobreviva a 16 px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04070d"/>
  <g fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- hemisferio izquierdo -->
    <path d="M30 12c-4-3-10-2-12 2-5 0-8 5-6 9-4 3-4 9 0 12-2 5 2 10 7 10 2 4 7 6 11 3z"/>
    <!-- hemisferio derecho -->
    <path d="M34 12c4-3 10-2 12 2 5 0 8 5 6 9 4 3 4 9 0 12 2 5-2 10-7 10-2 4-7 6-11 3z"/>
    <!-- pistas de circuito -->
    <path d="M30 22h-7l-3 4M30 32h-9M30 42h-6l-3-3"/>
    <path d="M34 22h7l3 4M34 32h9M34 42h6l3-3"/>
  </g>
  <g fill="#e0f2fe">
    <circle cx="20" cy="26" r="2.6"/>
    <circle cx="21" cy="32" r="2.6"/>
    <circle cx="21" cy="39" r="2.6"/>
    <circle cx="44" cy="26" r="2.6"/>
    <circle cx="43" cy="32" r="2.6"/>
    <circle cx="43" cy="39" r="2.6"/>
  </g>
</svg>
